name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build, format:check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        # `needs.ci.result` aggregates the whole matrix: success only if
        # every entry passed. Without the explicit check, branch
        # protection could treat a skipped gate (after a matrix failure)
        # as a non-failure.
        run: |
          echo "matrix result: ${{ needs.ci.result }}"
          [[ "${{ needs.ci.result }}" == "success" ]] || exit 1
